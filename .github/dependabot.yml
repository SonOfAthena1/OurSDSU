version: 2

updates:
  # Share related npm updates across the root and frontend manifests.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
    # Include major updates within each family; unmatched packages stay separate.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router*"
      typescript-eslint:
        patterns:
          - "*eslint*"
          - "globals"
          - "typescript"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@types/node"
      prettier:
        patterns:
          - "prettier"

  # Backend runtime and development requirements.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      fastapi-pydantic:
        patterns:
          - "fastapi"
          - "starlette"
          - "annotated-doc"
          - "pydantic*"
          - "annotated-types"
          - "typing-inspection"
          - "typing-extensions"
          - "typing_extensions"
      uvicorn:
        patterns:
          - "uvicorn"
          - "httptools"
          - "watchfiles"
          - "websockets"
          - "h11"
          - "click"
      backend-tests:
        patterns:
          - "pytest*"
          - "httpx*"
          - "httpcore*"

  # Actions referenced by workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "actions/*"
